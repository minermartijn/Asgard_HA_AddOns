name: Home Stock
slug: home_stock
version: "1.0.0"
description: "Huishoudvoorraad & boodschappen bijhouden met HA to-do sync en sensoren / Household stock & shopping tracker with HA to-do sync and sensors"
url: "https://github.com/minermartijn/Asgard_HA_AddOns"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:fridge-outline
panel_title: Voorraad
homeassistant_api: true
options:
  language: "nl"
  household_name: ""
  todo_entity: "todo.shopping_list"
  auto_sync_todo: false
  expose_sensors: true
schema:
  language: list(nl|en)
  household_name: str?
  todo_entity: str?
  auto_sync_todo: bool?
  expose_sensors: bool?
