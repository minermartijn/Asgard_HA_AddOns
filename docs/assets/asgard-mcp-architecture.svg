<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Asgard Home Assistant MCP Architecture</title>
<desc id="desc">An MCP-compatible client connects independently to a Full MCP server with 62 tools on port 8010 and a Lifeboat MCP server with 22 tools on port 8015. Full MCP accesses Home Assistant Core and Supervisor. Lifeboat accesses Supervisor and can help restart or restore Full MCP when the main server is offline but Supervisor and Lifeboat are operational.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091a31"/><stop offset="1" stop-color="#132945"/></linearGradient>
  <linearGradient id="full" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1876c0"/><stop offset="1" stop-color="#0f4f93"/></linearGradient>
  <linearGradient id="life" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#178d80"/><stop offset="1" stop-color="#096859"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#020d1a" flood-opacity=".28"/></filter>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#72c2ff"/></marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6ce7bc"/></marker>
  <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b7c9d9"/></marker>
</defs>
<rect width="1400" height="820" fill="url(#bg)"/>
<circle cx="1200" cy="-50" r="360" fill="#28669a" opacity=".07"/>
<circle cx="95" cy="800" r="350" fill="#2fae9d" opacity=".07"/>
<text x="62" y="80" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="white">Two MCP servers. One resilient Home Assistant setup.</text>
<text x="65" y="119" font-family="Arial, sans-serif" font-size="19" fill="#bdcee2">Full access for everyday operations. A separate Lifeboat when the primary connection stops.</text>
<rect x="65" y="164" width="240" height="34" rx="17" fill="#1f3958"/>
<text x="185" y="187" text-anchor="middle" font-size="14" font-weight="700" font-family="Arial, sans-serif" fill="#d5e8ff">ASGARD HOME ASSISTANT APPS</text>
<!-- client -->
<rect x="65" y="252" width="262" height="256" rx="20" fill="#213750" stroke="#577596" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="84" y="274" width="54" height="54" rx="12" fill="#324e70"/>
<text x="111" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="white">AI</text>
<text x="83" y="366" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="white">MCP-compatible client</text>
<text x="84" y="398" font-family="Arial, sans-serif" font-size="17" fill="#c6d8ea">Your AI assistant / agent</text>
<text x="84" y="428" font-family="Arial, sans-serif" font-size="16" fill="#c6d8ea">Two configured connections</text>
<text x="84" y="454" font-family="Arial, sans-serif" font-size="16" fill="#c6d8ea">Independent authentication</text>
<text x="84" y="480" font-family="Arial, sans-serif" font-size="16" fill="#c6d8ea">No automatic failover</text>
<!-- full -->
<rect x="450" y="206" width="395" height="249" rx="20" fill="url(#full)" stroke="#61b0eb" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="472" y="227" width="105" height="30" rx="15" fill="#093965"/>
<text x="524" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#cfe7ff">PORT 8010</text>
<text x="474" y="302" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="white">FULL MCP</text>
<text x="474" y="340" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#d4efff">62 tools / 8 categories</text>
<text x="474" y="370" font-family="Arial, sans-serif" font-size="16" fill="#eef8ff">Entities, automations, dashboards,</text>
<text x="474" y="395" font-family="Arial, sans-serif" font-size="16" fill="#eef8ff">integrations, backups, diagnostics,</text>
<text x="474" y="420" font-family="Arial, sans-serif" font-size="16" fill="#eef8ff">inventory and app management</text>
<!-- lifeboat -->
<rect x="450" y="503" width="395" height="244" rx="20" fill="url(#life)" stroke="#79d6bf" stroke-width="1.5" filter="url(#shadow)"/>
<rect x="472" y="524" width="105" height="30" rx="15" fill="#064c45"/>
<text x="524" y="544" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#d3fff2">PORT 8015</text>
<text x="474" y="600" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="white">LIFEBOAT MCP</text>
<text x="474" y="635" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#d5fff0">22 tools / 2 categories</text>
<text x="474" y="666" font-family="Arial, sans-serif" font-size="16" fill="#edfff7">App lifecycle, logs and updates</text>
<text x="474" y="694" font-family="Arial, sans-serif" font-size="16" fill="#edfff7">Targeted backup and restore</text>
<text x="474" y="720" font-family="Arial, sans-serif" font-size="16" fill="#edfff7">Separate fallback connection</text>
<!-- HA Core -->
<rect x="996" y="222" width="335" height="166" rx="20" fill="#263e58" stroke="#789bbb" stroke-width="1.5" filter="url(#shadow)"/>
<text x="1019" y="267" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="white">HOME ASSISTANT</text>
<text x="1019" y="298" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#b9dfff">CORE</text>
<text x="1019" y="327" font-family="Arial, sans-serif" font-size="16" fill="#d5e7f6">REST / WebSocket APIs</text>
<text x="1019" y="354" font-family="Arial, sans-serif" font-size="16" fill="#d5e7f6">Entities, states and automations</text>
<!-- Supervisor -->
<rect x="996" y="488" width="335" height="181" rx="20" fill="#263e58" stroke="#789bbb" stroke-width="1.5" filter="url(#shadow)"/>
<text x="1019" y="531" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="white">HOME ASSISTANT</text>
<text x="1019" y="562" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#b9dfff">SUPERVISOR</text>
<text x="1019" y="592" font-family="Arial, sans-serif" font-size="16" fill="#d5e7f6">Apps, logs and backups</text>
<text x="1019" y="621" font-family="Arial, sans-serif" font-size="16" fill="#d5e7f6">Restart / rebuild / restore</text>
<text x="1019" y="647" font-family="Arial, sans-serif" font-size="16" fill="#d5e7f6">the primary MCP app</text>
<!-- wires -->
<path d="M327 325H450" stroke="#72c2ff" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
<text x="341" y="308" font-family="Arial, sans-serif" font-size="14" fill="#c1e4ff">NORMAL</text>
<path d="M327 451H378V619H450" stroke="#6ce7bc" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>
<text x="340" y="603" font-family="Arial, sans-serif" font-size="14" fill="#b8fce6">FALLBACK</text>
<path d="M845 301H996" stroke="#b7c9d9" stroke-width="3.5" fill="none" marker-end="url(#arrowGray)"/>
<path d="M845 413H910V520H996" stroke="#b7c9d9" stroke-width="3.5" fill="none" marker-end="url(#arrowGray)"/>
<path d="M845 624H996" stroke="#6ce7bc" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>
<!-- Footer -->
<rect x="65" y="772" width="1266" height="34" rx="9" fill="#1e3750" opacity=".9"/>
<text x="86" y="793" font-family="Arial, sans-serif" font-size="15" fill="#e2efff">RECOVERY LIMITATION: Lifeboat requires a working host, network, Supervisor and Lifeboat service. Both MCPs are high privilege.</text>
</svg>