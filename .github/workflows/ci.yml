name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-boundary-check:
    name: Verify private boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for tracked private files
        run: |
          PROHIBITED='(^ASGARD_PRIVATE_PLAN/|^\.asgard-private/|^ASGARD_MASTER_PLAN\.md$|^AGENT_KICKOFF_PROMPT\.md$|^PRIVATE_BUILD_ROADMAP\.md$)'
          TRACKED=$(git ls-files | grep -E "$PROHIBITED" || true)
          if [ -n "$TRACKED" ]; then
            echo "ERROR: Private development files are tracked in git:"
            echo "$TRACKED"
            exit 1
          fi
          echo "PASS: No private development files are tracked."

  source-validation:
    name: Python syntax and add-on manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q baby_tracker home_stock ha_addons/src ha_full_mcp/src asgard_backup_inspector/app asgard_backup_inspector/tests asgard_notifyhub/app asgard_notifyhub/tests asgard_rain_break/app asgard_rain_break/tests
      - name: Validate add-on metadata
        run: |
          python -m pip install --disable-pip-version-check 'PyYAML>=6,<7'
          python - <<'PY'
          from pathlib import Path
          import yaml
          for folder in ("ha_full_mcp", "ha_addons", "baby_tracker", "home_stock", "asgard_backup_inspector", "asgard_notifyhub", "asgard_rain_break"):
              manifest = Path(folder) / "config.yaml"
              data = yaml.safe_load(manifest.read_text(encoding="utf-8"))
              for required in ("name", "version", "slug", "arch"):
                  assert data.get(required), f"{manifest}: missing {required}"
              assert (Path(folder) / "Dockerfile").exists(), f"{folder}: missing Dockerfile"
              print(f"{folder}: {data['name']} v{data['version']}")
          PY

  asgard-rain-break-tests:
    name: RainBreak tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: asgard_rain_break/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r asgard_rain_break/requirements-dev.txt
          python -m playwright install chromium
      - name: Run Python and Playwright test suite
        env:
          PYTHONPATH: asgard_rain_break
        run: python -m pytest asgard_rain_break/tests -v

  asgard-notifyhub-tests:
    name: NotifyHub tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: asgard_notifyhub/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r asgard_notifyhub/requirements-dev.txt
          python -m playwright install chromium
      - name: Run Python and Playwright test suite
        env:
          PYTHONPATH: asgard_notifyhub
        run: python -m pytest asgard_notifyhub/tests -v

  asgard-backup-inspector-tests:
    name: Backup Inspector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: asgard_backup_inspector/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r asgard_backup_inspector/requirements-dev.txt
          python -m playwright install chromium
      - name: Run JavaScript unit tests
        run: node --test asgard_backup_inspector/tests/test_frontend.js
      - name: Run Python and Playwright test suite
        env:
          PYTHONPATH: asgard_backup_inspector
        run: python -m pytest asgard_backup_inspector/tests -v

  mcp-regressions:
    name: MCP regressions (${{ matrix.addon }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: [ha_full_mcp, ha_addons]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.addon }}/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "${{ matrix.addon }}/requirements.txt" 'httpx-sse>=0.4,<1'
      - name: Run regression suite
        run: python -m unittest discover -s "${{ matrix.addon }}/tests" -p 'test_*.py' -v
