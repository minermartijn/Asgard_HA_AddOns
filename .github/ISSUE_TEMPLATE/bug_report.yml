name: Bug report
description: Report a reproducible, non-security problem in an add-on
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not post API keys, tokens, private addresses, or unredacted logs. For vulnerabilities, follow SECURITY.md instead of opening a public issue."
  - type: dropdown
    id: addon
    attributes:
      label: Affected add-on
      options:
        - HA Full MCP Server
        - Lifeboat MCP Server
        - Baby Tracker
        - Home Stock
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Add-on version
      placeholder: "e.g. 1.11.0"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version (if relevant)
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use fake data and redact all secrets
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
