name: Home Assistant KIRO MCP Server ADDON
version: "1.1.0"
slug: ha_mcp_server_addon_kiro
description: Model Context Protocol server for Home Assistant with full API access
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
init: false
host_network: true
ports:
  8015/tcp: 8015
ports_description:
  8015/tcp: "MCP Server Port"
options:
  log_level: info
  host: "0.0.0.0"
  port: 8015
  transport: sse
  ha_token: ""
  api_key: ""
schema:
  log_level: list(debug|info|warning|error)?
  host: str?
  port: port?
  transport: list(sse|stdio)?
  ha_token: password
  api_key: password
homeassistant_api: true
hassio_api: true
hassio_role: admin
auth_api: true
supervisor_api: true
privileged:
  - SYS_ADMIN
map:
  - config:rw
  - ssl:ro
  - addons:ro
  - backup:ro
ingress: false
panel_icon: mdi:api
