name: HA Addon MCP Server
version: "1.4.0"
slug: ha_addon_mcp_server
description: Lightweight Model Context Protocol (MCP) server dedicated to Home Assistant add-on lifecycle and recovery, including single-add-on backup and restore. Serves as an independent lifeboat server.
url: https://github.com/minermartijn/Asgard_HA_AddOns
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
host_network: true
ports:
  8015/tcp: 8015
ports_description:
  8015/tcp: "MCP Server Port"
options:
  log_level: info
  host: "0.0.0.0"
  port: 8015
  transport: sse
  ha_token: ""
  api_key: ""
schema:
  log_level: list(debug|info|warning|error)?
  host: str?
  port: port?
  transport: list(sse|stdio|streamable-http|all)?
  ha_token: password
  api_key: password
homeassistant_api: true
hassio_api: true
hassio_role: admin
auth_api: true
supervisor_api: true
privileged:
  - SYS_ADMIN
map:
  - type: homeassistant_config
    read_only: false
    path: /config
  - type: ssl
  - type: local_apps
    path: /addons
  - type: backup
ingress: false
panel_icon: mdi:api
